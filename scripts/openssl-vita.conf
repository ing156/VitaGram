# OpenSSL target for the PS Vita (VitaSDK, arm-vita-eabi). Used by scripts/build-openssl.sh
# through `Configure --config=`; the source-level port lives in scripts/openssl-vita.patch.
my %targets = (
    "vita-cross" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "arm-vita-eabi-gcc",
        CXX              => "arm-vita-eabi-g++",
        AR               => "arm-vita-eabi-ar",
        RANLIB           => "arm-vita-eabi-ranlib",
        CFLAGS           => picker(default => "-Wall",
                                   debug   => "-O0 -g",
                                   release => "-O2"),
        cflags           => add("-ffunction-sections -fdata-sections", threads("-pthread")),
        # No console UI (passphrase prompts), no AF_UNIX sockets and no syslog on the Vita.
        lib_cppflags     => add("-DOPENSSL_NO_UI_CONSOLE -DNO_SYS_UN_H -DNO_SYSLOG"),
        ex_libs          => add(threads("-pthread")),
        bn_ops           => "BN_LLONG RC4_CHAR",
        thread_scheme    => "pthreads",
        dso_scheme       => undef,
        perlasm_scheme   => "void",
        shared_target    => undef,
    },
);
